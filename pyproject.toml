[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heartbeat-yuanli-mcp"
version = "0.2.0"
description = "Unofficial local MCP server for AI control of Heartbeat Yuanli DokiDoki BLE devices"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Heartbeat Yuanli MCP contributors"}
]
dependencies = [
  "bleak>=0.21.1,<4",
  "fastmcp>=4,<5",
]

[project.scripts]
heartbeat-yuanli-mcp = "heartbeat_yuanli_mcp.server:main"

[tool.setuptools.packages.find]
include = ["heartbeat_yuanli_mcp*"]
